apply plugin: 'com.android.application'

android {
    ndkVersion "29.0.14206865"

    compileSdk 37

    namespace 'com.limelight'

    defaultConfig {
        minSdk 21
        targetSdk 36

        // Cartouche's own numbering (based on Moonlight 12.2).
        versionName "0.1.11"
        versionCode = 12

        // Generate native debug symbols to allow Google Play to symbolicate our native crashes
        ndk.debugSymbolLevel = 'FULL'
    }

    flavorDimensions.add("root")

    buildFeatures {
        buildConfig = true
        resValues = true
    }

    productFlavors {
        root {
            // Android O has native mouse capture, so don't show the rooted
            // version to devices running O on the Play Store.
            maxSdk 25

            externalNativeBuild {
                ndkBuild {
                    arguments "PRODUCT_FLAVOR=root"
                }
            }

            applicationId "games.borderline.cartouche.root"
            dimension "root"
            buildConfigField "boolean", "ROOT_BUILD", "true"
        }

        nonRoot {
            externalNativeBuild {
                ndkBuild {
                    arguments "PRODUCT_FLAVOR=nonRoot"
                }
            }

            applicationId "games.borderline.cartouche"
            dimension "root"
            buildConfigField "boolean", "ROOT_BUILD", "false"
        }
    }

    compileOptions {
        encoding "UTF-8"
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
        coreLibraryDesugaringEnabled true
    }

    lint {
        disable 'MissingTranslation'
        lintConfig file('lint.xml')
    }

    bundle {
        language {
            // Avoid splitting by language, since we allow users
            // to manually switch language in settings.
            enableSplit = false
        }
        density {
            // FIXME: This should not be necessary but we get
            // weird crashes due to missing drawable resources
            // when this split is enabled.
            enableSplit = false
        }
    }

    // Cartouche's release key: CARTOUCHE_KEYSTORE (a PKCS12 file) and CARTOUCHE_KEYSTORE_PASSWORD,
    // set by the release workflow from the repository's secrets. Without them, release builds
    // are unsigned.
    signingConfigs {
        if (System.getenv("CARTOUCHE_KEYSTORE")) {
            cartouche {
                storeFile file(System.getenv("CARTOUCHE_KEYSTORE"))
                storeType "pkcs12"
                storePassword System.getenv("CARTOUCHE_KEYSTORE_PASSWORD")
                keyAlias "cartouche"
                keyPassword System.getenv("CARTOUCHE_KEYSTORE_PASSWORD")
            }
        }
    }

    buildTypes {
        debug {
            applicationIdSuffix ".debug"
            resValue "string", "app_label", "Cartouche (Debug)"
            resValue "string", "app_label_root", "Cartouche (Root Debug)"
        }
        release {
            // Moonlight asks every fork to use its own application ID (see upstream's note here):
            // Cartouche's is games.borderline.cartouche, so no ".unofficial" suffix is needed.
            if (System.getenv("CARTOUCHE_KEYSTORE")) {
                signingConfig signingConfigs.cartouche
            }
            resValue "string", "app_label", "Cartouche"
            resValue "string", "app_label_root", "Cartouche (Root)"

            minifyEnabled true
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }

    externalNativeBuild {
        ndkBuild {
            path "src/main/jni/Android.mk"
        }
    }

    packaging {
        resources {
            // BouncyCastle includes duplicate LICENSE.md files
            excludes += '/META-INF/*.md'
        }
    }
}

dependencies {
    implementation 'org.bouncycastle:bcprov-jdk18on:1.85.2'
    implementation 'org.bouncycastle:bcpkix-jdk18on:1.85'
    implementation 'org.jcodec:jcodec:0.2.5'
    implementation 'com.squareup.okhttp3:okhttp:5.5.0'
    implementation 'org.jmdns:jmdns:3.6.3'
    implementation 'com.github.cgutman:ShieldControllerExtensions:1.0.1'
    // Cartouche's shell: a message channel open to the site's origin only.
    implementation 'androidx.webkit:webkit:1.12.1'

    coreLibraryDesugaring 'com.android.tools:desugar_jdk_libs:2.1.5'
}
